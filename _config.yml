author_bio: I am a Computer Games Design graduate who studied at the University of Staffordshire. Mechanics and Technical Design are my favourite aspects of game design but I am able to do any general design work. I enjoy working in a team to refine and condense ideas to help make a better product.
author_email: "liammiburns@gmail.com"
author_location: Stoke-On-Trent, UK
author_website_url: "liammiburns.github.io"
typewrite-text: A passionate gamedev engineer who loves to code #Isnt real
