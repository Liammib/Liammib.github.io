# Projects
author_project_details:
              - project_thumbnail: coalesce.png
                project_title: Coalesce
                project_description: An asymmetrical co-op arcade game which got ported onto a University of Staffordshire Arcade machine
                project_url: https://liammib.github.io/blog/coalesce/#/
                visibility: true
              - project_thumbnail: pushyplushy.png
                project_title: Pushy Plushy
                project_description: A verticle slice of a 4 player party game made in a collaborative module where I was a junior designer
                project_url: https://liammib.github.io/blog/pushy-plushy/#/
                visibility: true
              - project_thumbnail: castlewalls.png
                project_title: Cursor.zip
                project_description: A verticle slice of a 3d speedrunning platformer in a collaborative module where I was the lead deigner
                project_url: https://liammib.github.io/blog/cursorzip/#/
                visibility: true
              - project_thumbnail: controllerclash.png
                project_title: Controller Clash
                project_description: A platform fighter prototype made in Unity utilising 4 different controllers
                project_url: https://liammib.github.io/blog/controller-clash/#/
                visibility: true
              - project_thumbnail: tundramill.png
                project_title: KOTH_TundraMill
                project_description: A Team Foretress 2 multiplayer map, planned out and iterated on with testing and made in the Hammer engine
                project_url: https://liammib.github.io/blog/tundramill/#/
                visibility: true
